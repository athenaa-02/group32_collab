<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <title>NASA Location Map</title>
    <link rel="stylesheet" href="map.css" />
  </head>
  <body>
    <h1>NASA Headquarters Location</h1>

    <div class="map-container">
      <iframe
        src="https://www.google.com/maps?q=NASA+Headquarters+Washington+DC&output=embed"
        allowfullscreen=""
        loading="lazy"
      >
      </iframe>
    </div>

    <div class="info">
      <h2>რატომ არის NASA ვაშინგტონში?</h2>
      <div class="flex">
        <p>
          NASA არის ამერიკის სახელმწიფო კოსმოსური სააგენტო. მისი მთავარი ოფისი
          მდებარეობს დედაქალაქში, რათა იყოს ახლოს მთავრობის მთავარ უწყებებთან.
        </p>

        <img src="./download.jpeg" alt="" />
      </div>
    </div>
  </body>
</html>
